# Harness -> telemetry proxy (8125) -> vllm-metal (8124). vllm-metal serves the model under its
# folder name (--served-model-name), so the request model id is the folder name, not the full
# path. Used by Tools/run_eval_seatbelt.sh with SERVER=vllm_metal (the default).
models:
  gemma-4-e4b-it-qat-w4a16-ct:
    path: openai/gemma-4-e4b-it-qat-w4a16-mlx
    api_base: http://127.0.0.1:8125/v1
    api_key: EMPTY
