[package]
name = "repo_structural_ir"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
walkdir = "2.5"
tree-sitter = "0.25"
tree-sitter-python = "0.25"
memmap2 = "0.9"
rayon = "1.12"

[[bin]]
name = "repo_ir"
path = "src/main.rs"
