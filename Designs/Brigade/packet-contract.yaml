packet_id: BRIGADE-DESIGN-001
status: proposed
date: 2026-11-10
deliverable: >-
  Documentation, machine-readable schemas and contracts, draft lane runbooks,
  examples, and an offline validator for a snapshot-backed Gemma 4 brigade.
depends_on:
  - competition-rules-audit
  - harness-contract-read
declared_context:
  - AGENTS.md
  - CHECKPOINT.md
  - DataSets/public/HARNESS_README.md
  - PaperTrack/phase2/generate.py
declared_tools:
  - read_file
  - apply_patch
  - exec_command
judges:
  - type: file_exists
    path: design.md
  - type: file_exists
    path: brigade-workflow.md
  - type: file_exists
    path: Governing_law.md
  - type: command
    command: .venv-harness/bin/python Designs/Brigade/tools/validate_contracts.py Designs/Brigade
  - type: contains
    path: AUDIT.md
    value: The brigade must not replace or modify `AgenticSubmission/v0_baseline`
release_requires:
  - all_judges_pass
  - active_phase2_untouched
  - adversarial_items_dispositioned
