schema_version: "0.1.0"
contract_kind: design_spec
runtime_binding: not_yet_compiled
required_model: gemma-4-e4b-it-qat-w4a16-ct
agents:
  - name: graph_seed_agent
    model: gemma-4-e4b-it-qat-w4a16-ct
    lane: C1
    output_key: brigade_c1_graph_seeds
    include_contents: none
    source_write: false
    tools: [search_similar_code, get_code_neighbors, read_file]
  - name: graph_relation_agent
    model: gemma-4-e4b-it-qat-w4a16-ct
    lane: C2
    output_key: brigade_c2_graph_relations
    include_contents: none
    source_write: false
    tools: [search_similar_code, get_code_neighbors, get_code_subgraph, read_file]
  - name: snapshot_agent
    model: gemma-4-e4b-it-qat-w4a16-ct
    lane: C7
    output_key: brigade_c7_snapshot
    include_contents: none
    source_write: false
    tools: [read_file, run_command]
  - name: structural_ir_agent
    model: gemma-4-e4b-it-qat-w4a16-ct
    lane: C3
    output_key: brigade_c3_structural_ir
    include_contents: none
    source_write: false
    tools: []
  - name: edge_coherence_agent
    model: gemma-4-e4b-it-qat-w4a16-ct
    lane: C5
    output_key: brigade_c5_edges
    include_contents: none
    source_write: false
    tools: []
  - name: api_contract_agent
    model: gemma-4-e4b-it-qat-w4a16-ct
    lane: C6
    output_key: brigade_c6_api
    include_contents: none
    source_write: false
    tools: []
  - name: risk_compliance_agent
    model: gemma-4-e4b-it-qat-w4a16-ct
    lane: C4
    output_key: brigade_c4_risk
    include_contents: none
    source_write: false
    tools: [get_status]
  - name: synthesis_agent
    model: gemma-4-e4b-it-qat-w4a16-ct
    lane: S
    output_key: brigade_decision_packet
    include_contents: none
    source_write: false
    tools: [get_status]
  - name: implementer_agent
    model: gemma-4-e4b-it-qat-w4a16-ct
    lane: I
    output_key: brigade_implementation_result
    include_contents: none
    source_write: true
    tools: [read_file, edit_file, write_file, run_command, get_status]
  - name: verification_agent
    model: gemma-4-e4b-it-qat-w4a16-ct
    lane: C8
    output_key: brigade_verification
    include_contents: none
    source_write: false
    tools: [read_file, run_command, get_status]
  - name: finalizer_agent
    model: gemma-4-e4b-it-qat-w4a16-ct
    lane: F
    output_key: brigade_finalization
    include_contents: none
    source_write: false
    tools: [get_status, submit_patch]
rules:
  unique_output_keys: true
  sole_source_writer: implementer_agent
  sole_submitter: finalizer_agent
  submit_patch_last: true
  callbacks: forbidden
  open_ended_loops: forbidden
  cross_task_state: forbidden
