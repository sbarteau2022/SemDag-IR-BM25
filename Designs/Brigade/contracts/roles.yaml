schema_version: "0.1.0"
contract_kind: four_role_candidate
runtime_binding: not_yet_compiled
required_model: gemma-4-e4b-it-qat-w4a16-ct
roles:
  - id: lead
    kind: root
    lanes: [S, I, F]
    controller: true
    source_write: true
    submit_patch: true
    tools: [read_file, edit_file, write_file, run_command, get_status, submit_patch]
  - id: localizer
    kind: agent_tool
    lanes: [C1, C2]
    controller: false
    source_write: false
    submit_patch: false
    tools: [read_file, search_similar_code, get_code_neighbors, get_code_subgraph]
  - id: analyst
    kind: agent_tool
    lanes: [C3, C4, C5, C6]
    controller: false
    source_write: false
    submit_patch: false
    tools: [get_status]
  - id: verifier
    kind: agent_tool
    lanes: [C8]
    controller: false
    source_write: false
    submit_patch: false
    tools: [read_file, run_command, get_status]
deterministic_producers:
  - lane: C7
    kind: snapshot_skill
    host_role: lead
  - lane: S
    kind: packet_validation_skill
    host_role: lead
  - lane: F
    kind: presubmit_skill
    host_role: lead
rules:
  one_base_model: true
  sole_source_writer: lead
  sole_submitter: lead
  preserve_logical_lanes: true
