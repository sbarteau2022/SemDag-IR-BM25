agent_class: SequentialAgent
name: v8_ensemble
description: >
  Lead first (testing script + code review, assigns work) -> 4 parallel implementers ->
  1 adversarial reviewer -> final implementer (gate, adopt, last test, submit).
sub_agents:
  - config_path: sub_agents/lead.yaml
  - config_path: sub_agents/implementers.yaml
  - config_path: sub_agents/adversary.yaml
  - config_path: sub_agents/finalizer.yaml
