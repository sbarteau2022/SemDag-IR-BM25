agent_class: SequentialAgent
name: v8_ensemble
description: >
  Army fork + 4 parallel implementers -> 4 parallel adversarial reviewers ->
  coordinator gate (pytest, static typecheck, code review) -> final implementer.
sub_agents:
  - config_path: sub_agents/implementers.yaml
  - config_path: sub_agents/adversaries.yaml
  - config_path: sub_agents/coordinator.yaml
  - config_path: sub_agents/finalizer.yaml
