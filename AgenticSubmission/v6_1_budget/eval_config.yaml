# Per-task budgets, read by the scorer (only these four fields; the default is no limit).
# 12 h covers ~120 sequential tasks including vLLM start-up and per-task container setup.
# 720 min - ~10 min vLLM start - ~30 min setup (15 s x 120) = 680 min; / 120 = 5.67 min.
# 5 min x 120 = 600 min agent time (+40) = 640 min: 80 min headroom at 120 tasks, 30 min
# at 130. The harness enforces the clock with asyncio.timeout around the whole agent run,
# so an in-flight model call cannot overrun it. Observed v6 tool calls: max 15 (cap 40).
evaluation:
  timeout_seconds: 120
  max_tool_calls: 40
  max_time_minutes: 5
  max_turns: 60
