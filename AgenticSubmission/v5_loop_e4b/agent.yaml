agent_class: LoopAgent
name: swe_fix_verify_loop
description: >
  Edit-then-verify loop. The coder localizes via the deterministic repo_eval
  automaton and edits; the verifier re-runs repo_eval --verify (frozen-baseline
  parity + syntax + the repo's own tests) after every fix and submits only when
  the verdict is clean. Bounded by max_iterations.
max_iterations: 4
sub_agents:
  - config_path: sub_agents/coder.yaml
  - config_path: sub_agents/verifier.yaml
