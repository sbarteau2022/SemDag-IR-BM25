# Per-task budget: owner rule 2026-11-17 (competition defaults). About 120 hidden tasks run one at a
# time in one 12 h job; tasks that hit the cap end about 30 s late, so plan 5.5 min per task.
evaluation:
  timeout_seconds: 300      # competition default command timeout; the harness caps it at the time left
  max_tool_calls: 40
  max_time_minutes: 4       # owner rule 2026-11-17: 4 min/task
  max_turns: 60
