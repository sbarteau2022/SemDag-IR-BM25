# Per-task budgets read by the scorer (all four fields; the default is no limit).
# 5 min x ~120 sequential tasks (+ ~30 s overrun each + setup) fits the 12 h job.
evaluation:
  timeout_seconds: 300      # competition default command timeout; the harness caps it at the time left
  max_tool_calls: 40
  max_time_minutes: 5
  max_turns: 60
