# Executor (code lane). Greedy, no penalties: edit_file must copy old_string exactly and
# new_string mostly repeats it, so repetition penalties would corrupt edits. Runaway
# generation is bounded by the short thinking budget and the output cap instead.
temperature: 0.0
top_p: 1.0
max_output_tokens: 4096
thinking_config:
  thinking_budget: 1024
  include_thoughts: true
