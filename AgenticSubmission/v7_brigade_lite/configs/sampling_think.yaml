# Planner (think lane). Gemma's own defaults for exploration (generation_config.json:
# temperature 1.0, top_k 64, top_p 0.95), moderate penalties against looping thoughts.
# The planner writes no code, so penalties cannot corrupt an edit.
temperature: 1.0
top_k: 64
top_p: 0.95
presence_penalty: 0.3
frequency_penalty: 0.2
max_output_tokens: 6144
thinking_config:
  thinking_budget: 4096
  include_thoughts: true
