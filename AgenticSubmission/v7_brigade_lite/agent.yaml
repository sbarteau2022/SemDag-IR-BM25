agent_class: LoopAgent
name: brigade_lite
description: >
  Plan (think, no edits) -> execute (temperature 0) -> deterministic audit and sign-off,
  up to 3 rounds. Each role starts from a fresh context and sees only the previous role's
  last message plus session state (plan, verdict).
max_iterations: 3
sub_agents:
  - config_path: sub_agents/planner.yaml
  - config_path: sub_agents/executor.yaml
  - config_path: sub_agents/auditor.yaml
