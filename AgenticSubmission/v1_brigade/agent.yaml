name: brigade_lead
description: Sole source editor and patch submitter for a snapshot-backed coding task.
model: gemma-4-e4b-it-qat-w4a16-ct
instruction: !include prompts/lead.md
tools:
  - read_file
  - edit_file
  - write_file
  - run_command
  - get_status
  - submit_patch
  - agent_tool:
      config_path: sub_agents/localizer.yaml
      skip_summarization: true
  - agent_tool:
      config_path: sub_agents/analyst.yaml
      skip_summarization: true
  - agent_tool:
      config_path: sub_agents/verifier.yaml
      skip_summarization: true
skills:
  - skills/snapshot-check
  - skills/packet-check
  - skills/presubmit-check
generate_content_config: !include configs/sampling.yaml
